[project]
name = "infra-automation"
version = "0.3.0"
description = "Infrastructure Automation MCP server — a deterministic simulated fleet with monitoring, deployment, scaling, backup, secret rotation, and log analysis, exposed across prompts + tools + HTTP API + chat agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
infra-mcp = "infra_automation.mcp_server:main"
infra-api = "infra_automation.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infra_automation"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
